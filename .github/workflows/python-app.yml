name: Python CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Poetry
        uses: snok/install-poetry@v1

      - name: Instalar dependências
        run: poetry install --no-root --no-interaction

      - name: Executar testes
        run: poetry run pytest

      - name: Construir imagem Docker
        run: docker build -t fastapi-app:latest .

      - name: Validar execução do container
        run: |
          docker run -d --name fastapi-app-test -p 8000:8000 fastapi-app:latest
          sleep 5
          docker inspect -f '{{.State.Running}}' fastapi-app-test | grep -q true
          docker logs fastapi-app-test
          docker stop fastapi-app-test